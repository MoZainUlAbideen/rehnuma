[project]
name = "rehnuma"
version = "0.1.0"
description = "Rehnuma (رہنما) — an AI copilot that audits Pakistani electricity bills and guides solar decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pypdf>=5.0",
]

[project.scripts]
rehnuma-eval-extract = "rehnuma.evals.extract_eval:main"
rehnuma-eval-summary = "rehnuma.evals.summary_eval:main"
rehnuma-summary = "rehnuma.explain.cli:main"
rehnuma-eval-auditor = "rehnuma.evals.auditor_eval:main"
rehnuma-audit = "rehnuma.cli:main"
rehnuma-policy = "rehnuma.policy.cli:main"
rehnuma-eval-policy = "rehnuma.evals.policy_retrieval_eval:main"
rehnuma-eval-answer = "rehnuma.evals.policy_answer_eval:main"
rehnuma-eval-route = "rehnuma.evals.route_eval:main"
rehnuma-ask = "rehnuma.assistant.cli:main"
rehnuma-api = "rehnuma.api.server:main"
[project.optional-dependencies]
# Live backend (milestone 7): uv sync --extra api
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# Dense multilingual retrieval (HF embeddings) - optional: pulls torch (CPU build)
dense = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rehnuma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
