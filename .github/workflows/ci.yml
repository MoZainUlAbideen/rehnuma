# Runs on every push to main and every pull request.
# backend: lint + 270 tests + the no-API eval gate (fails if any metric drops)
# web:     lint + production build of the Next.js site
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (Python from .python-version, deps from uv.lock)
        run: uv sync --frozen --extra api
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest
      - name: Eval gate (no API calls)
        run: uv run rehnuma-ci-evals

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build